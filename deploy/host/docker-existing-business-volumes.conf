[Unit]
Requires=teamaibox-existing-business-volumes.service
After=teamaibox-existing-business-volumes.service

[Service]
# Recheck identity even when the oneshot is already active. Never initialize
# Docker bind volumes on an unmounted plaintext directory.
ExecStartPre=/usr/bin/python3 /usr/local/lib/teamaibox/restore_existing_business_volumes.py --configuration /etc/teamaibox/storage-volumes.json --check
