[Unit]
StartLimitIntervalSec=0
# Dependency lists cannot be cleared with an empty Requires= in a drop-in.
# Install the corrected base unit AND office-frontdoor-order.conf together.
# Storage/Docker readiness is checked by ExecStartPre, so failure is retried.
Wants=docker.service teamaibox-existing-business-volumes.service
Wants=teamaibox-frontdoor.service
After=teamaibox-frontdoor.service

[Service]
TimeoutStartSec=infinity
Restart=on-failure
RestartSec=15
