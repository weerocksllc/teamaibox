# Normal single-appliance office routes and installed protection policies.
# Historical v5 acceptance bundles are not an installation or boot dependency.
services:
  platform-api:
    labels:
      com.teamaibox.config-digest: ${TEAMAIBOX_PLATFORM_CONFIGURATION_DIGEST:?}
    environment:
      PLATFORM_PROTECTED_OFFICE_SET_ID: office.baseline
      PLATFORM_PROTECTED_OFFICE_SET_NODE_ID: ${PLATFORM_APPLIANCE_NODE_ID:?}
      PLATFORM_PROTECTED_OFFICE_SET_RESTART_POLICY_DIGEST: ${TEAMAIBOX_APPLIANCE_RESTART_POLICY_SEMANTIC_DIGEST:?}
      PLATFORM_APPLIANCE_PROTECTED_TARGET_POLICY_DIGEST: ${TEAMAIBOX_EXCLUSIVE_DRAIN_TARGETS_DIGEST:?}
      LOCAL_OPENAI_WORKER_ID: ${LOCAL_OPENAI_WORKER_ID:?preserve the installed local Worker identity}
      LOCAL_OPENAI_WORKER_ORIGIN: http://teamaibox-worker-${LOCAL_OPENAI_WORKER_ID:?preserve the installed local Worker identity}:8000
      LOCAL_OPENAI_MODEL_ALIAS: local/qwen3.8-27b-nvfp4
      LOCAL_OPENAI_SERVED_MODEL: qwen3.8-27b-nvfp4
