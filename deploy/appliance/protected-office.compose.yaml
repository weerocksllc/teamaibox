    # The local Agent shares this namespace and serves retained application
    # plugins and Android browser sessions over these internal networks.
    networks: [edge, control, data, compute-internal, plugin-ingress, phone-control]

  node-agent:
    environment:
      TEAMAIBOX_EXCLUSIVE_DRAIN_TARGETS_FILE: /run/teamaibox/protected-targets.v1.json
      TEAMAIBOX_EXCLUSIVE_DRAIN_TARGETS_DIGEST: ${TEAMAIBOX_EXCLUSIVE_DRAIN_TARGETS_DIGEST:?}
      TEAMAIBOX_APPLIANCE_RESTART_POLICY_FILE: /run/teamaibox/appliance-restart-policy.v1.json
      TEAMAIBOX_APPLIANCE_RESTART_POLICY_DIGEST: ${TEAMAIBOX_APPLIANCE_RESTART_POLICY_DIGEST:?}
      TEAMAIBOX_PROTECTED_SET_QUALIFICATION_POLICY_FILE: /run/teamaibox/protected-set-qualification-policy.v1.json
      TEAMAIBOX_PROTECTED_SET_QUALIFICATION_POLICY_DIGEST: ${TEAMAIBOX_PROTECTED_SET_QUALIFICATION_POLICY_DIGEST:?}
    volumes:
      - ${TEAMAIBOX_EXCLUSIVE_DRAIN_TARGETS_FILE:?}:/run/teamaibox/protected-targets.v1.json:ro
      - ${TEAMAIBOX_APPLIANCE_RESTART_POLICY_FILE:?}:/run/teamaibox/appliance-restart-policy.v1.json:ro
      - ${TEAMAIBOX_PROTECTED_SET_QUALIFICATION_POLICY_FILE:?}:/run/teamaibox/protected-set-qualification-policy.v1.json:ro

networks:
  plugin-ingress:
    external: true
    name: ${TEAMAIBOX_PLUGIN_INGRESS_NETWORK:?prepare the installation-owned plugin network}
  phone-control:
    external: true
    name: ${TEAMAIBOX_PHONE_CONTROL_NETWORK:?preserve the installed local phone control network}
  compute-internal:
    external: true
    name: ${TEAMAIBOX_COMPUTE_INTERNAL_NETWORK:?prepare the installation-owned compute network}
