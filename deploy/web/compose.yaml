networks:
  web_slots:
    driver: bridge
    internal: true
  platform_edge:
    external: true
    name: ${TEAMAIBOX_PLATFORM_EDGE_NETWORK:-teamaibox-foundation_edge}

secrets:
  web_tls_certificate:
    file: ${TEAMAIBOX_WEB_TLS_CERTIFICATE_FILE:?set an absolute certificate-chain path}
  web_tls_private_key:
    file: ${TEAMAIBOX_WEB_TLS_PRIVATE_KEY_FILE:?set an absolute private-key path}

configs:
  plugin_routes:
    file: ../plugins/web-routes.v1.json
