<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
  <title>Text Recognition</title><link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon.png">
  <link rel="stylesheet" href="/plugins/official.ocr/app.css"><link rel="stylesheet" href="/plugins/official.ocr/platform-preferences.css">
<link rel="stylesheet" href="/plugins/official.ocr/ui-system.css"></head>
<body data-ui-app="ocr">
<main class="ocr-shell">
  <header class="app-header">
    <div><p class="eyebrow" data-i18n="eyebrow">文档智能</p><h1 data-i18n="title">文字识别</h1><p data-i18n="subtitle">从图片与 PDF 提取文字和 Markdown 结构，并安全交给其他应用。</p></div>
    <div class="header-chips">
      <span id="model-tier" class="tier-chip" hidden><span data-i18n="experimental">实验模型</span></span>
      <span class="secure-chip"><i></i><span data-i18n="secure">加密输入与结果</span></span>
    </div>
  </header>
  <section class="workspace">
    <aside class="source-panel">
      <div class="source-tabs" role="group" data-i18n-aria="inputSource" aria-label="输入来源"><button type="button" class="is-active" data-source="upload" data-i18n="upload" aria-pressed="true">本地上传</button><button type="button" data-source="drive" data-i18n="drive" aria-pressed="false">网盘选择</button></div>
      <section id="upload-source" class="source-view">
        <label class="drop-zone" id="drop-zone" role="button" tabindex="0" data-keyboard-file-trigger>
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp,application/pdf" hidden>
          <span class="drop-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M4 16v4h16v-4"/></svg></span><strong data-i18n="chooseFile">选择图片或 PDF</strong><small data-i18n="fileHint">PNG · JPEG · WebP · PDF</small>
        </label>
        <div id="selected-file" class="selected-file" hidden><span>▧</span><div><strong id="file-name"></strong><small id="file-size"></small></div><button id="clear-file" type="button" data-i18n-aria="clear" aria-label="清除所选文件">×</button></div>
      </section>
      <section id="drive-source" class="source-view" hidden>
        <div class="drive-heading"><div><strong data-i18n="driveTitle">我的文件</strong><small data-i18n="driveHint">从网盘选择要识别的文件</small></div><button id="refresh-drive" type="button" data-i18n-aria="refresh" aria-label="刷新网盘文件">↻</button></div>
        <div id="drive-list" class="drive-list"></div>
        <p id="drive-empty" class="empty-copy" data-i18n="driveEmpty">尚无可选择文件，可以先从本地上传。</p>
      </section>

      <div class="options">
        <label><span data-i18n="format">输出格式</span><select id="format"><option value="json" data-i18n="jsonBlocks">JSON + 文本块</option><option value="markdown">Markdown</option><option value="text" data-ui-copy="Text" data-ui-copy-zh="文本">Text</option><option value="hocr">hOCR</option></select></label>
        <label><span data-i18n="languages">语言提示</span><input id="languages" placeholder="zh-CN, en"></label>
      </div>
      <div id="form-error" class="error" role="alert" hidden></div>
      <button id="submit" class="primary" type="button"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4m8 0h4v4m0 8v4h-4m-8 0H4v-4M8 9h8m-8 4h8m-8 4h5"/></svg><span data-i18n="recognize">开始识别</span></button>
      <p class="queue-note" data-i18n="queueNote">提交后可查看进度；首次使用时可能需要等待模型准备。</p>
    </aside>

    <section class="result-panel" aria-live="polite">
      <div id="empty" class="empty-result"><span aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24"><path d="M4 8V4h4m8 0h4v4m0 8v4h-4m-8 0H4v-4M8 9h8m-8 4h8m-8 4h5"/></svg></span><h2 data-i18n="emptyTitle">识别结果将在这里出现</h2><p data-i18n="emptyBody">完成后可按页查看和校对文字、导出文件，或继续翻译。</p></div>
      <div id="job" role="status" aria-live="polite" aria-busy="true" hidden>
        <header class="job-header"><div><p class="eyebrow" data-i18n="currentJob">当前任务</p><h2 id="status"></h2></div><button id="cancel" type="button" class="secondary" data-i18n="cancel">取消</button></header>
        <div class="progress"><i id="progress"></i></div><p id="job-detail" class="muted"></p><div id="job-error" class="error" role="alert" hidden></div>
        <div id="result" hidden>
          <div class="result-toolbar"><div class="view-tabs" role="group" data-i18n-aria="resultView" aria-label="识别结果视图"><button type="button" class="is-active" data-view="text" data-i18n="textView" aria-pressed="true">校正文稿</button><button id="layout-tab" type="button" data-view="layout" data-i18n="layoutView" aria-pressed="false">版式块</button></div><div><button id="export" type="button" class="secondary" data-i18n="export">导出</button><button id="handoff" type="button" class="primary primary--small" data-i18n="handoff">交给翻译</button></div></div>
          <p id="geometry-note" class="capability-note" role="status" aria-live="polite" data-i18n="geometryUnavailable" hidden></p>
          <textarea id="corrected-text" class="corrected-text" spellcheck="true" data-i18n-aria="correctedText" aria-label="识别校正文稿"></textarea>
          <div id="layout" class="layout-view" hidden></div>
          <details class="ui-result-details"><summary data-i18n="resultDetails">结果详情</summary><footer id="provenance" class="provenance"></footer></details>
        </div>
      </div>
    </section>
  </section>
</main>
<script type="module" src="/plugins/official.ocr/app.js"></script>
</body></html>
