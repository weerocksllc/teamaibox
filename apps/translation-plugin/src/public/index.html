<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Translation</title><link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon.png"><link rel="stylesheet" href="/plugins/official.translation/app.css"><link rel="stylesheet" href="/plugins/official.translation/platform-preferences.css"><style>.header-badges{display:flex;align-items:center;gap:8px;height:max-content}.model-tier{padding:9px 13px;border:1px solid #9a6a15;border-radius:99px;background:color-mix(in srgb,#d49421 12%,var(--panel));color:#d49421;font-size:11px;font-weight:750}</style><link rel="stylesheet" href="/plugins/official.translation/ui-system.css"></head><body data-ui-app="translation">
<main class="shell"><header class="app-header"><div><p class="eyebrow" data-i18n="eyebrow">多模态语言工作台</p><h1 data-i18n="title">翻译</h1><p data-i18n="subtitle">翻译文字、图片、文档或音视频，查看双语对照结果。</p></div><div class="header-badges"><span id="model-tier" class="model-tier" hidden data-i18n="experimental">实验模型</span><span class="secure"><i></i><span data-i18n="secure">文字、文档与音视频翻译</span></span></div></header>
<section class="workspace"><aside class="controls"><div class="tabs" role="group" data-i18n-aria="inputSource" aria-label="输入来源"><button type="button" class="is-active" data-source="text" data-i18n="text" aria-pressed="true">文本</button><button type="button" data-source="upload" data-i18n="upload" aria-pressed="false">本地文件</button><button type="button" data-source="drive" data-i18n="drive" aria-pressed="false">团队网盘</button></div>
<section id="text-view"><textarea id="source-text" maxlength="200000" data-i18n-placeholder="textPlaceholder" data-i18n-aria="sourceText" placeholder="输入需要翻译的文字…" aria-label="待翻译文字"></textarea><div class="counter"><span id="text-count">0</span> / 200,000</div></section>
<section id="upload-view" hidden><label class="drop" id="drop" role="button" tabindex="0" data-keyboard-file-trigger><input id="file" type="file" accept="image/*,application/pdf,audio/*,video/*" hidden><span>译</span><strong data-i18n="choose">选择图片、PDF、音频或视频</strong><small data-i18n="hint">上传文件，或从团队网盘选择</small></label><div id="selected" class="selected" hidden><b id="kind-badge">FILE</b><div><strong id="file-name"></strong><small id="file-meta"></small></div><button id="clear" type="button" data-i18n-aria="clear" aria-label="清除所选文件">×</button></div><div id="preview"></div></section>
<section id="drive-view" hidden><div class="drive-head"><div><strong data-i18n="driveTitle">选择要翻译的文件</strong><small data-i18n="driveHint">从网盘选择要翻译的文件</small></div><button id="refresh" type="button" data-i18n-aria="refresh" aria-label="刷新网盘文件">↻</button></div><div id="drive-list" class="drive-list"></div><p id="drive-empty" class="empty-copy" data-i18n="driveEmpty">尚无可选择文件。</p></section>
<div class="language-row"><label><span data-i18n="sourceLanguage">源语言</span><select id="source-language" aria-describedby="language-count"></select></label><button id="swap" type="button" data-i18n-aria="swap" aria-label="交换源语言和目标语言">⇄</button><label><span data-i18n="targetLanguage">目标语言</span><select id="target-language" aria-describedby="language-count"></select></label></div>
<p id="language-count" class="language-count"></p>
<div class="options"><label><span data-i18n="format">输出格式</span><select id="format"><option value="text" data-ui-copy="Text" data-ui-copy-zh="文本">Text</option><option value="json">JSON</option><option value="markdown">Markdown</option><option value="srt">SRT</option><option value="vtt">WebVTT</option></select></label><label class="check"><input id="layout" type="checkbox" checked><span><strong data-i18n="layout">保留版式与时间轴</strong><small data-i18n="layoutHint">适用于文档和字幕</small></span></label></div>
<div id="pipeline" class="pipeline"><span data-stage="ocr">OCR</span><b>→</b><span data-stage="asr">ASR</span><b>→</b><span data-stage="translation" data-ui-copy="Translation" data-ui-copy-zh="翻译">Translation</span><b>→</b><span data-stage="subtitle" data-ui-copy="Subtitles" data-ui-copy-zh="字幕">Subtitles</span></div>
<div id="form-error" class="error" role="alert" hidden></div><button id="submit" class="primary" type="button"><span>文A</span><span data-i18n="submit">开始翻译</span></button><p class="queue-note" data-i18n="queue">文件会先识别或转写，再翻译；可查看每一步的结果。</p></aside>
<section class="result" aria-live="polite"><div id="empty" class="empty-result"><span>文A</span><h2 data-i18n="emptyTitle">翻译结果将在这里出现</h2><p data-i18n="emptyBody">输入文字或选择文件，开始翻译。完成后可查看双语对照和下载结果。</p></div><div id="job" role="status" aria-live="polite" aria-busy="true" hidden><header class="job-head"><div><p class="eyebrow" data-i18n="current">当前翻译</p><h2 id="status"></h2></div><button id="cancel" type="button" class="secondary" data-i18n="cancel">取消</button></header><div class="progress"><i id="progress-bar"></i></div><div class="progress-copy"><span id="detail"></span><strong id="percent">0%</strong></div><div id="job-error" class="error" role="alert" hidden></div>
<div id="translation-result" hidden><div class="summary"><span id="language-summary"></span><span id="kind-summary"></span><button id="export" class="secondary" type="button" data-i18n="export">导出</button></div><textarea id="translated-text" data-i18n-aria="translatedText" aria-label="翻译结果"></textarea><div id="segments" class="segments"></div><details class="workflow-card ui-result-details"><summary data-i18n="workflow">处理步骤与结果</summary><p data-i18n="workflowHint">下载中间结果以便审阅</p><div id="workflow-stages" class="workflow-stages"></div><div id="intermediates" class="intermediates"></div><footer id="provenance" class="provenance"></footer></details></div></div></section></section></main><script type="module" src="/plugins/official.translation/app.js"></script></body></html>
