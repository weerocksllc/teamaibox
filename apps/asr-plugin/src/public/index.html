<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Speech Transcription</title><link rel="stylesheet" href="/plugins/official.asr/app.css"><link rel="stylesheet" href="/plugins/official.asr/platform-preferences.css"><link rel="stylesheet" href="/plugins/official.asr/experimental.css"><link rel="stylesheet" href="/plugins/official.asr/ui-system.css"></head><body data-ui-app="asr">
<main class="shell"><header class="app-header"><div><p class="eyebrow" data-i18n="eyebrow">音视频智能</p><h1 data-i18n="title">语音转写</h1><p data-i18n="subtitle">将音频或视频转为文字，方便查找、整理和导出。</p></div><div class="header-badges"><span id="model-tier" class="experimental" hidden data-i18n="experimental">实验模型</span><span class="secure"><i></i><span data-i18n="secure">音视频转写</span></span></div></header>
<section class="workspace"><aside class="controls"><div class="tabs" role="group" data-i18n-aria="inputSource" aria-label="输入来源"><button type="button" class="is-active" data-source="upload" data-i18n="upload" aria-pressed="true">本地上传</button><button type="button" data-source="drive" data-i18n="drive" aria-pressed="false">网盘选择</button><button type="button" data-source="live" data-i18n="live" aria-pressed="false">实时麦克风</button></div>
<section id="upload-view"><label class="drop" id="drop" role="button" tabindex="0" data-keyboard-file-trigger><input id="file" type="file" accept="audio/wav,audio/x-wav,audio/flac,audio/x-flac,audio/ogg,audio/webm,audio/mpeg,audio/mp4,audio/aiff,audio/x-aiff,video/mp4,video/webm" hidden><span>≋</span><strong data-i18n="choose">选择音频或视频</strong><small data-i18n="hint">音频、MP4 或 WebM</small></label><div id="selected" class="selected" hidden><b>▶</b><div><strong id="file-name"></strong><small id="file-meta"></small></div><button id="clear" type="button" data-i18n-aria="clear" aria-label="清除所选媒体">×</button></div><audio id="audio-preview" controls hidden></audio><video id="video-preview" controls hidden></video></section>
<section id="drive-view" hidden><div class="drive-head"><div><strong data-i18n="driveTitle">音视频文件</strong><small data-i18n="driveHint">从网盘选择音频或视频</small></div><button id="refresh" type="button" data-i18n-aria="refresh" aria-label="刷新网盘文件">↻</button></div><div id="drive-list" class="drive-list"></div><p id="drive-empty" class="empty-copy" data-i18n="driveEmpty">尚无可选择媒体。</p></section>
<section id="live-view" class="live-control" hidden><div class="live-orb" id="live-orb"><i></i><span>●</span></div><strong data-i18n="liveTitle">实时语音转写</strong><small data-i18n="liveHint">每个音频分片独立处理，不在浏览器或服务端保留录音。</small><label><span data-i18n="language">语言</span><select id="live-language"><option value="" data-ui-copy="Auto" data-ui-copy-zh="自动检测">Auto</option><option value="zh" data-ui-language="zh">简体中文</option><option value="en" data-ui-language="en">English</option><option value="ja" data-ui-language="ja">日本語</option><option value="ko" data-ui-language="ko">한국어</option></select></label><button id="live-toggle" class="primary" type="button"><span>●</span><span data-i18n="liveStart">开始实时转写</span></button><p id="live-control-status" class="queue-note" role="status" aria-live="polite" data-i18n="liveIdle">麦克风尚未启用</p></section>
<section id="batch-controls"><div class="options"><label><span data-i18n="language">语言</span><select id="language"><option value="" data-ui-copy="Auto" data-ui-copy-zh="自动检测">Auto</option><option value="zh-CN" data-ui-language="zh-CN">简体中文</option><option value="en" data-ui-language="en">English</option><option value="ja" data-ui-language="ja">日本語</option><option value="ko" data-ui-language="ko">한국어</option></select></label><label><span data-i18n="format">导出格式</span><select id="format"><option value="json">JSON</option><option value="srt">SRT</option><option value="vtt">WebVTT</option><option value="text" data-ui-copy="Text" data-ui-copy-zh="文本">Text</option></select></label></div>
<label class="check"><input id="word-timestamps" type="checkbox"><span><strong data-i18n="wordTime">词级时间戳</strong><small data-i18n="wordHint">增加处理与结果体积</small></span></label><label class="check"><input id="speakers" type="checkbox" disabled><span><strong data-i18n="speakers">说话人信息</strong><small data-i18n="speakerHint">WAV 音频将使用全局说话人分离</small></span></label>
<div id="form-error" class="error" role="alert" hidden></div><button id="submit" class="primary" type="button" disabled aria-busy="false"><span>≋</span><span data-i18n="submit">开始转写</span></button><p class="queue-note" data-i18n="queue">长任务可持续跟踪、取消并在断线后重新打开。</p></section></aside>
<section class="result" aria-live="polite"><div id="empty" class="empty-result"><span>≋</span><h2 data-i18n="emptyTitle">时间轴转写结果</h2><p data-i18n="emptyBody">选择音频或视频，开始转写。提交后可查看进度。</p></div><div id="live-result" hidden><header class="job-head"><div><p class="eyebrow" data-i18n="liveSession">实时会话</p><h2 id="live-status" data-i18n="liveIdle">麦克风尚未启用</h2></div><span class="live-badge"><i></i><span id="live-counter">00:00</span></span></header><div id="live-error" class="error" role="alert" hidden></div><div class="live-transcript-head"><strong data-i18n="liveTranscript">实时转写内容</strong><small data-i18n="livePrivacy">音频分片处理后立即释放</small></div><div id="live-segments" class="live-segments"><p class="empty-copy" data-i18n="liveEmpty">开始说话后，识别结果会按分片出现在这里。</p></div></div><div id="job" role="status" aria-live="polite" aria-busy="true" hidden><header class="job-head"><div><p class="eyebrow" data-i18n="current">当前任务</p><h2 id="status"></h2></div><button id="cancel" type="button" class="secondary" data-i18n="cancel">取消</button></header><div class="progress"><i id="progress"></i></div><div class="progress-copy"><span id="detail"></span><strong id="percent">0%</strong></div><div id="job-error" class="error" role="alert" hidden></div>
<div id="transcript" hidden><div class="summary"><span id="detected-language"></span><span id="duration"></span><span id="speaker-summary"></span><div class="summary-actions"><button id="export" type="button" class="secondary" data-i18n="export">导出</button><button id="handoff" type="button" class="primary" data-i18n="handoff">交给翻译</button></div></div><div id="segments" class="segments"></div><details class="ui-result-details"><summary data-i18n="resultDetails">结果详情</summary><footer id="provenance" class="provenance"></footer></details></div></div></section></section></main><script type="module" src="/plugins/official.asr/app.js"></script></body></html>
