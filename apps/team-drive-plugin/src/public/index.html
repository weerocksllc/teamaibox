<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Team Drive</title>
  <link rel="stylesheet" href="/plugins/official.team-drive/app.css"><link rel="stylesheet" href="/plugins/official.team-drive/platform-preferences.css">
<link rel="stylesheet" href="/plugins/official.team-drive/ui-system.css"></head>
<body data-ui-app="team-drive">
<main class="drive-shell">
  <aside id="navigation" class="drive-nav" data-i18n-aria="driveNavigation" aria-label="Drive navigation">
    <header class="brand"><span class="brand-mark">◆</span><div><p data-i18n="eyebrow">安全协作空间</p><h1 data-i18n="title">团队网盘</h1></div><button id="close-nav" class="icon-button mobile-only" type="button" data-i18n-aria="close" aria-label="关闭">×</button></header>
    <nav class="root-nav">
      <p data-i18n="spaces">空间</p>
      <div id="root-list" class="root-list"></div>
      <p data-i18n="library">资料库</p>
      <button type="button" data-view="shared"><span>♧</span><b data-i18n="sharedWithMe">共享给我</b></button>
      <button type="button" data-view="recent"><span>◷</span><b data-i18n="recent">最近使用</b></button>
      <button type="button" data-view="recycle"><span>♲</span><b data-i18n="recycle">回收站</b></button>
    </nav>
    <section class="security-note"><span>✓</span><div><strong data-i18n="encrypted">加密存储</strong><p data-i18n="encryptedBody">文件加密保存在盒子上。</p></div></section>
    <section class="quota-card"><header><span data-i18n="storage">存储空间</span><b id="quota-label">—</b></header><div><i id="quota-bar"></i></div><p id="quota-detail">—</p></section>
  </aside>

  <section class="drive-main">
    <header class="topbar">
      <button id="open-nav" class="icon-button mobile-only" type="button" data-i18n-aria="menu" aria-label="打开菜单">☰</button>
      <label class="global-search"><span aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" data-i18n-placeholder="search" data-i18n-aria="search" placeholder="搜索文件与文件夹" aria-label="搜索文件与文件夹"></label>
      <button id="new-folder" class="secondary-button" type="button" data-i18n-aria="newFolder" aria-label="新建文件夹"><span>＋</span><b data-i18n="newFolder">新建文件夹</b></button>
      <label class="primary-button" role="button" tabindex="0" data-keyboard-file-trigger data-i18n-aria="upload" aria-label="上传"><span>⇧</span><b data-i18n="upload">上传</b><input id="file-input" type="file" multiple hidden></label>
    </header>

    <section class="content-header">
      <div><nav id="breadcrumbs" class="breadcrumbs" data-i18n-aria="breadcrumb" aria-label="Breadcrumb"></nav><p id="location-subtitle"></p></div>
      <div class="view-controls" role="group" data-i18n-aria="layout" aria-label="文件布局"><button id="refresh" class="icon-button" type="button" data-i18n-aria="refresh" aria-label="刷新">↻</button><button id="list-view" class="icon-button is-active" type="button" data-i18n-aria="listView" aria-label="列表视图" aria-pressed="true">☷</button><button id="grid-view" class="icon-button" type="button" data-i18n-aria="gridView" aria-label="网格视图" aria-pressed="false">⊞</button></div>
    </section>
    <div id="notice" class="notice" role="status" hidden></div>
    <section id="upload-panel" class="upload-panel" role="status" aria-live="polite" aria-busy="true" hidden><header><div><strong id="upload-title"></strong><span id="upload-state"></span></div><b id="upload-percent">0%</b></header><div class="progress"><i id="upload-progress"></i></div><p id="upload-detail"></p><button id="cancel-upload" type="button" data-i18n="cancel">取消</button></section>
    <div id="error" class="inline-error" role="alert" hidden></div>
    <div id="loading" class="file-skeleton" role="status" aria-live="polite" aria-busy="true" data-i18n-aria="loading" aria-label="正在载入安全文件索引"><i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i></div>

    <section id="files-region" class="files-region" aria-live="polite">
      <div class="file-table-header"><span data-i18n="name">名称</span><span data-i18n="owner">所有者</span><span data-i18n="modified">修改时间</span><span data-i18n="size">大小</span><span></span></div>
      <div id="file-list" class="file-list"></div>
    </section>
    <section id="empty" class="empty-state" hidden><span>◇</span><h2 data-i18n="empty">这里还没有文件</h2><p data-i18n="emptyBody">上传文件或新建文件夹，开始团队协作。</p><label class="primary-button" role="button" tabindex="0" data-keyboard-file-trigger data-i18n-aria="uploadFirst" aria-label="上传第一个文件"><b data-i18n="uploadFirst">上传第一个文件</b><input type="file" data-upload-empty hidden></label></section>
  </section>

  <aside id="details" class="details-pane" data-i18n-aria="detailsEyebrow" aria-label="File details" aria-hidden="true" inert hidden>
    <header><div><p data-i18n="detailsEyebrow">文件详情</p><h2 id="details-name">—</h2></div><button id="close-details" class="icon-button" type="button" data-i18n-aria="close" aria-label="关闭">×</button></header>
    <div id="details-icon" class="details-icon">◇</div>
    <dl id="details-facts"></dl>
    <div id="details-actions" class="details-actions"></div>
    <section><header><strong data-i18n="versions">版本历史</strong><button id="new-version" type="button" data-i18n="addVersion">添加版本</button></header><div id="version-list" class="version-list"></div></section>
  </aside>
</main>

<dialog id="text-dialog"><form id="text-form"><header><div><p id="dialog-eyebrow"></p><h2 id="dialog-title"></h2></div><button class="icon-button" type="button" data-dialog-close data-i18n-aria="close" aria-label="关闭">×</button></header><label><span id="dialog-label"></span><input id="dialog-input" maxlength="255" required></label><label id="dialog-parent-field"><span data-i18n="destination">目标位置</span><select id="dialog-parent"></select></label><p id="dialog-error" class="inline-error" role="alert" hidden></p><footer><button type="button" class="secondary-button" data-dialog-close data-i18n="cancel">取消</button><button id="dialog-submit" type="submit" class="primary-button" data-i18n="confirm">确认</button></footer></form></dialog>

<dialog id="share-dialog"><form id="share-form"><header><div><p data-i18n="shareEyebrow">内部共享</p><h2 data-i18n="shareTitle">共享给团队成员</h2></div><button class="icon-button" type="button" data-share-close data-i18n-aria="close" aria-label="关闭">×</button></header><label><span data-i18n="principal">成员 ID 或团队键</span><input id="share-principal" required autocomplete="off"></label><div class="form-grid"><label><span data-i18n="principalKind">类型</span><select id="share-kind"><option value="identity" data-i18n="person">成员</option><option value="team" data-i18n="team">团队</option></select></label><label><span data-i18n="role">权限</span><select id="share-role"><option value="viewer" data-i18n="viewer">只读</option><option value="editor" data-i18n="editor">可编辑</option></select></label></div><label><span data-i18n="expires">到期时间（可选）</span><input id="share-expiry" type="datetime-local"></label><p id="share-error" class="inline-error" role="alert" hidden></p><footer><button type="button" class="secondary-button" data-share-close data-i18n="cancel">取消</button><button type="submit" class="primary-button" data-i18n="share">共享</button></footer></form></dialog>

<dialog id="trash-dialog" aria-labelledby="trash-dialog-title" aria-describedby="trash-dialog-description" aria-busy="false"><form id="trash-form"><header><div><p data-i18n="detailsEyebrow">文件详情</p><h2 id="trash-dialog-title" data-i18n="delete">移到回收站</h2></div><button class="icon-button" type="button" data-trash-close data-i18n-aria="close" aria-label="关闭">×</button></header><p id="trash-dialog-description" class="dialog-warning"></p><footer><button id="trash-cancel" type="button" class="secondary-button" data-trash-close data-i18n="cancel">取消</button><button id="trash-confirm" type="submit" class="danger-button" data-i18n="confirm">确认</button></footer></form></dialog>

<dialog id="preview-dialog" class="preview-dialog"><header><div><p data-i18n="preview">预览</p><h2 id="preview-title"></h2></div><button id="close-preview" class="icon-button" type="button" data-i18n-aria="close" aria-label="关闭">×</button></header><div id="preview-body" class="preview-body"></div></dialog>
<input id="version-input" type="file" hidden>
<script type="module" src="/plugins/official.team-drive/app.js"></script>
</body>
</html>
